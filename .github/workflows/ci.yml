name: CI

on:
  push:
    branches: [main]
    # VibeCTX is distributed as source, so a `v*` tag IS the release artifact — the thing a
    # user checks out and builds. It must therefore be verified. Until 2026-09-07 the only
    # tag-triggered job lived in publish.yml; removing that workflow with npm distribution
    # would have left `git push --tags` running nothing at all.
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The change-record gate is only as good as its checker. Its fixtures assert that each
      # malformed verdict shape is actually rejected, so a permissive edit to the validator
      # fails here rather than passing silently on a real Change Record.
      - run: python3 .github/gate-verdict-format/validate_verdict.py --self-test
