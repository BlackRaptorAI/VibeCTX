# doctor — weekly retrieval-coverage check (PAR-707)
#
# Action versions mirror .github/workflows/ci.yml, pinned to commit SHAs (PAR-779) rather
# than the mutable major-version tags they were on before.
#
# WHAT IT DOES
#   Builds the package and runs `vibectx doctor` against the default registry
#   with a cold cache and live network. Fails the job when any library is
#   unhealthy: unreachable, index-only with no links followed, a probe query
#   with no match, or a cache older than 2x TTL (cannot occur cold). The JSON
#   report is uploaded as an artifact either way.
#
# WHAT IT CANNOT DO
#   Judge whether the returned sections are the right ones — doctor measures
#   retrieval, not correctness. A ✗ says "an agent asking this today gets
#   nothing"; a ✓ says "it gets something".
#
# EXPECTED FIRST RESULT (NOT VERIFIED — docs sites are unreachable from the
#   build sandbox; only raw.githubusercontent.com was exercised): aws-cdk may
#   ✗ if docs.aws.amazon.com/cdk/v2/guide/llms.txt is absent, because its
#   README fallback does not mention Kinesis/Firehose. That is the intended
#   signal; adjust the probe or the URLs in src/registry.ts, not the check.

name: doctor

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: vibectx doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run doctor (live network, cold cache)
        run: |
          set +e
          node dist/index.js doctor --json > doctor-report.json
          code=$?
          # Human table from the cache the JSON pass just warmed — no second network pass.
          node dist/index.js doctor --offline
          exit $code
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doctor-report
          path: doctor-report.json
